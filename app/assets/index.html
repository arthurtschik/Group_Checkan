<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anwesenheit</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f7; --text:#18202f; --muted:#6b7488; --line:#e2e6ef;
  --primary:#3b5bfd; --primary-soft:#e6ebff; --on-primary:#fff;
  --ok:#16a34a; --ok-soft:#e3f6ea; --sick:#dc2626; --sick-soft:#fde8e8; --pick:#d97706; --pick-soft:#fdf1dc;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06);
  --radius:16px;
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#1a202b; --surface2:#242b38; --text:#e9edf5; --muted:#97a0b3; --line:#2c3443;
  --primary:#7b93ff; --primary-soft:#26304f; --on-primary:#0f131b;
  --ok:#34d27a; --ok-soft:#173326; --sick:#f87171; --sick-soft:#3a1d20; --pick:#fbbf24; --pick-soft:#3a2e14;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;font-size:16px;
  -webkit-user-select:none;user-select:none;overflow:hidden}
input,select,button{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header{background:var(--surface);padding:14px 16px 10px;box-shadow:var(--shadow);z-index:2}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font-size:22px;font-weight:750;letter-spacing:-.01em}
.htitle .sub{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.ppill{--pc:#3b5bfd;position:relative;flex:none;min-width:38px;height:28px;padding:0 9px;border:0;border-radius:999px;
  background:var(--surface2);color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,var(--surface));font-weight:800;font-size:13px;letter-spacing:.03em;
  display:grid;place-items:center;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 35%,transparent)}
:root[data-theme="dark"] .ppill{background:color-mix(in srgb,var(--pc) 28%,var(--surface));color:color-mix(in srgb,var(--pc) 55%,#fff)}
.ppill>span{display:block;will-change:transform}
.ppill.multi::after{content:"";position:absolute;left:50%;bottom:2px;width:12px;height:2px;margin-left:-6px;border-radius:2px;background:currentColor;opacity:.35}
.ppill:active{transform:scale(.95)}
.ppill.static{pointer-events:none}
.ppill.big{height:36px;min-width:48px;font-size:15px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 10px;border-radius:14px;background:var(--surface2)}
.prow.active{background:var(--primary-soft)}
.prow .info{flex:1;min-width:0}
.prow .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta{font-size:13px;color:var(--muted)}
.prow .act{background:var(--surface)}
.pcheck{color:var(--primary);display:grid}
.pcheck svg{width:20px;height:20px}
.pcolors{display:flex;gap:10px;flex-wrap:wrap}
.pcolors button{width:34px;height:34px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.pcolors button.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.sortbtn{height:44px;border-radius:12px;border:0;background:var(--surface2);display:flex;align-items:center;gap:6px;padding:0 12px 0 10px;font-size:13.5px;font-weight:650;flex:none}
.sortbtn svg{width:20px;height:20px;color:var(--primary)}
.sortbtn:active{transform:scale(.95)}
.iconbtn:active{transform:scale(.94)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px}
nav.bottom{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:600}
nav.bottom button .pill{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.active{color:var(--text)}
nav.bottom button.active .pill{background:var(--primary-soft);color:var(--primary)}

/* day tabs */
.days{display:flex;gap:6px;margin-top:12px}
.days button:first-child[data-wd="all"]{flex:.9}
.days button{flex:1;border:0;border-radius:12px;background:var(--surface2);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.days button b{font-size:15px}
.days button small{font-size:11px;color:var(--muted)}
.days button.active{background:var(--primary);color:var(--on-primary)}
.days button.active small{color:inherit;opacity:.85}
.days button.today:not(.active){box-shadow:inset 0 0 0 2px var(--primary)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:5px}
.stat .n svg{width:18px;height:18px}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.ok .n{color:var(--ok)} .stat.pick .n{color:var(--pick)} .stat.sick .n{color:var(--sick)} .stat.open .n{color:var(--muted)}
.stats{position:relative}
.stat{transition:background .45s ease,color .45s ease,transform .3s}
.stat .n svg,.stat .l{transition:color .45s}
.stats.done .stat .n,.stats.done .stat .l{color:#fff}
.stats.done .stat.ok{background:var(--ok)} .stats.done .stat.pick{background:var(--pick)}
.stats.done .stat.sick{background:var(--sick)} .stats.done .stat.open{background:var(--primary)}
:root[data-theme="dark"] .stats.done .stat .n,:root[data-theme="dark"] .stats.done .stat .l{color:#0f131b}
.stats.done .stat .l{opacity:.9}
.stats.celebrate .stat{animation:tilepop .45s cubic-bezier(.3,1.5,.5,1) both}
.stats.celebrate .stat:nth-child(2){animation-delay:.06s;transition-delay:.06s}
.stats.celebrate .stat:nth-child(3){animation-delay:.12s;transition-delay:.12s}
.stats.celebrate .stat:nth-child(4){animation-delay:.18s;transition-delay:.18s}
@keyframes tilepop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:none}}
.burst{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:30}
.burst i{position:absolute;left:-48px;top:-48px;width:96px;height:96px;border-radius:50%;border:4px solid var(--ok);animation:ring 1s ease-out forwards}
.burst span{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(22,163,74,.45);animation:dot 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
.burst span svg{width:46px;height:46px}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes dot{0%{transform:scale(0)}30%{transform:scale(1.12)}45%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:-4px 0 12px;display:flex}
.progress i{display:block;height:100%;transition:width .35s}

.banner{background:var(--primary-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner svg{width:20px;height:20px;flex:none;color:var(--primary)}
.banner button{margin-left:auto;border:0;background:var(--primary);color:var(--on-primary);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:650;flex:none}

.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* kid rows */
.list{display:flex;flex-direction:column;gap:8px}
.kid{position:relative;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 0;overflow:hidden;transition:background .25s}
.kid .bar{width:6px;align-self:stretch;border-radius:0 4px 4px 0;flex:none}
.kid .check{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.kid .check svg{width:20px;height:20px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.kid .info{flex:1;min-width:0;padding:4px 0}
.kid .nline{display:flex;align-items:baseline;gap:8px;min-width:0}
.kid .cg{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);transform:translateY(-2px)}
.kid .cg .dot{width:8px;height:8px}
.kid .fn{font-size:21px;font-weight:800;letter-spacing:-.01em}
.kid .ln{font-size:14px;font-weight:600;color:var(--text);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kid .name{font-size:21px;line-height:1.2;min-width:0;flex:0 1 auto;position:relative;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;transition:color .3s}
.kid .name::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:currentColor;border-radius:2px;transform:scaleX(0);transform-origin:left center;transition:transform .32s cubic-bezier(.6,0,.3,1)}
.kid .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kid .tag{display:inline-flex;align-items:center;gap:4px;font-weight:650;font-size:12.5px;border-radius:8px;padding:1px 7px}
.kid .acts{display:flex;gap:6px;flex:none}
.act{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);color:var(--muted);display:grid;place-items:center;transition:all .2s}
.act svg{width:22px;height:22px}
.act:active{transform:scale(.92)}

.kid.present{background:var(--ok-soft)}
.kid.present .check{background:var(--ok);border-color:var(--ok)}
.kid.present .check svg{opacity:1;transform:scale(1);color:#fff}
.kid.present .name{color:var(--muted)}
.kid.present .name::after{transform:scaleX(1)}

.kid.pickedup{background:var(--pick-soft)}
.kid.pickedup .check{background:var(--pick);border-color:var(--pick)}
.kid.pickedup .check svg{opacity:1;transform:scale(1);color:#fff}
.kid.pickedup .name{color:var(--muted)}
.kid.pickedup .name::after{transform:scaleX(1)}
.kid.pickedup .act.pick{background:var(--pick);color:#fff}

.kid.sick{background:var(--sick-soft)}
.kid.sick .check{background:var(--sick);border-color:var(--sick)}
.kid.sick .check svg{opacity:1;transform:scale(1);color:#fff}
.kid.sick .name{color:var(--muted)}
.kid.sick .act.sickb{background:var(--sick);color:#fff}
.kid .tag.ok{background:var(--ok);color:#fff}
.kid .tag.pick{background:var(--pick);color:#fff}
.kid .tag.sick{background:var(--sick);color:#fff}
.kid.pop .check{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.18)}}
.kid:active{filter:brightness(.97)}

.section-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--sick);color:#fff}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}

/* master data */
.mrow{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px}
.mrow .info{flex:1;min-width:0}
.mrow .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .meta{font-size:13px;color:var(--muted);margin-top:2px}
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe .mrow{position:relative;z-index:1;touch-action:pan-y;will-change:transform}
.swipe-bg{position:absolute;inset:0;background:var(--sick);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s}
.swipe.swiping .swipe-bg{opacity:.75}
.swipe-bg span{display:flex;align-items:center;gap:8px}
.swipe-bg svg{width:22px;height:22px;transition:transform .15s}
.swipe.left .swipe-bg span:first-child,.swipe:not(.left) .swipe-bg span:last-child{visibility:hidden}
.swipe.armed .swipe-bg{opacity:1}
.swipe.armed .swipe-bg svg{transform:scale(1.25)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 6px 0 12px;margin-bottom:4px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--primary)}
.search>svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:12px 0;-webkit-user-select:text;user-select:text}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:var(--surface2);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.search button svg{width:16px;height:16px}
.daychips{display:flex;gap:3px;margin-top:5px}
.daychips i{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;background:var(--surface2);color:var(--muted);opacity:.55}
.daychips i.on{background:var(--primary-soft);color:var(--primary);opacity:1}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;border:0;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 18px rgba(59,91,253,.4);display:grid;place-items:center;z-index:5}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}

/* calendar */
.cal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{flex:1;text-align:center;margin:0;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid7 .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:650;padding:4px 0}
.cday{aspect-ratio:1;border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;position:relative}
.cday.other{opacity:.3}
.cday.weekend{color:var(--muted)}
.cday.today{box-shadow:inset 0 0 0 2px var(--primary);font-weight:750}
.cday.sel{background:var(--primary);color:var(--on-primary)}
.cday .mk{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cday .mk.none{background:transparent}
.cday.sel .mk{background:var(--on-primary)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:12px 4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px}
#cMonth{margin-top:4px}
.daycard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.daycard h3{margin:0 0 4px;font-size:17px}
.daycard .meta{color:var(--muted);font-size:14px}
.daycard .row{display:flex;gap:8px;margin-top:12px}
.daycard .row .btn{flex:1}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;box-shadow:0 0 0 12px transparent}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border-color:var(--primary);background:var(--surface)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:7px;font-size:14px}
.colors button .dot{width:18px;height:18px}
.colors button.active{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text);font-weight:650}
.daypick{display:flex;gap:6px}
.daypick button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:650}
.daypick button.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.sheet .actions{display:flex;gap:8px;margin-top:6px}
.sheet .actions .btn{flex:1}
.gemo{line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.gprev{width:26px;display:flex;justify-content:center;flex:none}
.gnames{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.gname{display:flex;align-items:center;gap:12px}
.gname input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.gname input:focus{border-color:var(--primary);background:var(--surface)}
.switchrow{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.switchrow>span{flex:1;font-weight:650}
.switchrow small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.switchrow input{display:none}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switchrow input:checked+.switch{background:var(--primary)}
.switchrow input:checked+.switch::after{transform:translateX(18px)}
.optlist.radio button{justify-content:space-between}
.radio-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.optlist.radio button.sel .radio-dot{border-color:var(--primary)}
.optlist.radio button.sel .radio-dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary)}
.field input[type=password]{letter-spacing:.1em}
.optlist button{width:100%;border:0;background:none;display:flex;align-items:center;gap:14px;padding:14px 4px;border-radius:12px;text-align:left;font-size:16px}
.optlist button:active{background:var(--surface2)}
.optlist button svg{width:24px;height:24px;color:var(--primary)}
.optlist button small{display:block;color:var(--muted);font-size:13px}
.preview{font-family:ui-monospace,"Roboto Mono","DejaVu Sans Mono",monospace;font-size:10.5px;line-height:1.35;background:var(--surface2);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre;-webkit-user-select:text;user-select:text;margin:0 0 12px;max-height:45vh}

/* ---------- Constants ---------- */
const WD_LONG=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const WD_SHORT=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const COLORS=[
  {id:"hellblau",name:"Hellblau",c:"#38bdf8"},{id:"dunkelblau",name:"Dunkelblau",c:"#1d4ed8"},
  {id:"lila",name:"Lila",c:"#a855f7"},{id:"pink",name:"Pink",c:"#ec4899"},
  {id:"orange",name:"Orange",c:"#f97316"},{id:"rot",name:"Rot",c:"#ef4444"},
  {id:"gelb",name:"Gelb",c:"#facc15"},{id:"gruen",name:"Grün",c:"#22c55e"}
];
const NO_COLOR={id:"",name:"Ohne Gruppe",c:"#9ca3af"};
/** Group names can be renamed per profile (DB.settings.groupNames); the colours and ids stay the same. */
const groupName=c=>{const n=DB&&DB.settings&&DB.settings.groupNames&&DB.settings.groupNames[c.id];return (n&&n.trim())||c.name};
/* Group look derived from its name: colour words set the colour, known words (animals, nature …) get an emoji.
   Names that match nothing keep the slot's own distinct colour. Longer stems first so "hellblau" wins over "blau". */
const COLOR_WORDS=[["dunkelblau","#1d4ed8"],["hellblau","#38bdf8"],["himmelblau","#38bdf8"],["dunkelgrün","#15803d"],["hellgrün","#84cc16"],
  ["dunkelrot","#b91c1c"],["türkis","#14b8a6"],["violett","#8b5cf6"],["orange","#f97316"],["schwarz","#1f2937"],["silber","#cbd5e1"],
  ["braun","#a16207"],["beige","#d6c4a8"],["weiß","#e5e7eb"],["weiss","#e5e7eb"],["lila","#a855f7"],["pink","#ec4899"],["rosa","#f9a8d4"],
  ["mint","#34d399"],["gold","#eab308"],["grau","#9ca3af"],["gelb","#facc15"],["grün","#22c55e"],["gruen","#22c55e"],["blau","#3b82f6"],["rot","#ef4444"]];
const EMOJI_WORDS=[
  ["🐻",["bär","baer","eisbär"]],["🦊",["fuchs","füchs","fuechs"]],["🦁",["löwe","loewe"]],["🐯",["tiger"]],["🐰",["hase","häs","hasen","kaninch"]],
  ["🦔",["igel"]],["🦉",["eule"]],["🐸",["frosch","frösch"]],["🐭",["maus","mäus"]],["🐱",["katze","kater","kätz"]],["🐶",["hund","welpe"]],
  ["🐴",["pferd","pony","fohlen"]],["🐘",["elefant"]],["🐵",["affe"]],["🐧",["pinguin"]],["🐬",["delfin","delphin"]],["🐳",["=wal","wale","walfisch"]],
  ["🦈",["=hai","haie","haifisch"]],["🐟",["fisch"]],["🐢",["schildkröt"]],["🦋",["schmetterling","falter"]],["🐝",["biene","hummel"]],["🐞",["marienkäfer","käfer"]],
  ["🐛",["raupe"]],["🐌",["schnecke"]],["🦖",["dino","saurier"]],["🐉",["drache"]],["🦄",["einhorn","einhörn"]],["🐼",["panda"]],["🐨",["koala"]],
  ["🦒",["giraffe"]],["🦓",["zebra"]],["🐺",["wolf","wölf"]],["🦅",["adler","falke"]],["🦆",["ente"]],["🐥",["küken","kueken"]],["🐔",["huhn","hühn","hahn"]],
  ["🐮",["kuh","kühe"]],["🐷",["schwein"]],["🐑",["schaf","lamm","lämm"]],["🐐",["ziege"]],["🐿️",["eichhörn","eichhoern"]],["🦫",["biber"]],
  ["🐊",["krokodil"]],["🐍",["schlange"]],["🐙",["krake","oktopus"]],["🦀",["krebs","krabbe"]],["🦙",["lama"]],["🦘",["känguru"]],
  ["🦏",["nashorn","nashörn"]],["🦩",["flamingo"]],["🦜",["papagei"]],["🐦",["vogel","vögel","spatz","rabe","meise","amsel"]],["🦦",["otter"]],
  ["🦭",["robbe","seehund"]],["🦌",["hirsch","=reh","rehe","rehkitz"]],["🐹",["hamster","meerschwein"]],["🐲",["monsterchen"]],
  ["☀️",["sonne"]],["⭐",["stern"]],["🌙",["mond"]],["🌈",["regenbogen"]],["☁️",["wolke"]],["⚡",["blitz"]],["❄️",["schnee","=eis","eiskristall"]],
  ["🌸",["blume","blüte"]],["🌻",["sonnenblume"]],["🌹",["rose"]],["🌷",["tulpe"]],["🌳",["baum","bäum","wald"]],["🍄",["pilz"]],["🍀",["klee"]],
  ["🍃",["blatt","blätt"]],["🌰",["kastanie","eichel"]],["🍎",["apfel","äpfel"]],["🍓",["erdbeer"]],["🍒",["kirsche"]],["🍌",["banane"]],
  ["🍋",["zitrone"]],["🥕",["möhre","karotte"]],["🚀",["rakete","astronaut"]],["🏴‍☠️",["pirat"]],["🛡️",["ritter"]],["👑",["prinz","könig","krone"]],
  ["🚒",["feuerwehr"]],["❤️",["herz"]],["💎",["diamant","edelstein","kristall"]],["⚽",["fußball","fussball","=ball","bälle"]],["👻",["gespenst","geist"]],
  ["🤖",["roboter"]],["👾",["monster"]],["🧚",["=fee","feen","elfe"]],["🧙",["zauber","wichtel","zwerg"]],["🌊",["welle","meer"]],["🔥",["feuer","flamme"]],
  ["🎈",["ballon"]],["🎵",["musik","noten"]],["🌍",["welt","erde"]]];
const nameWords=n=>(n||"").toLocaleLowerCase("de").split(/[^a-zäöüß]+/).filter(Boolean);
function lookOf(name){
  const w=nameWords(name); let color=null, emoji=null;
  for(const [k,c] of COLOR_WORDS) if(w.some(x=>x.startsWith(k))){color=c;break}
  for(const [e,stems] of EMOJI_WORDS) if(stems.some(st=>w.some(x=>st[0]==="="?x===st.slice(1):x.startsWith(st)))){emoji=e;break}
  return {color,emoji};
}
const EXTRA_COLORS=["#ef4444","#f97316","#facc15","#22c55e","#38bdf8","#1d4ed8","#a855f7","#ec4899","#14b8a6","#a16207","#84cc16","#6366f1","#f43f5e","#78716c"];
/** Looks for all groups at once, so groups without a colour word never share a colour with another group. */
function groupLooks(){
  const looks=COLORS.map(c=>({c,name:groupName(c),...lookOf(groupName(c))}));
  const used=new Set(looks.filter(l=>l.color).map(l=>l.color));
  for(const l of looks) if(!l.color&&!used.has(l.c.c)){l.color=l.c.c;used.add(l.c.c)}   // keep own colour if free
  for(const l of looks) if(!l.color){const col=EXTRA_COLORS.find(x=>!used.has(x))||l.c.c;l.color=col;used.add(col)}
  return looks;
}
const colorOf=id=>{const c=COLORS.find(c=>c.id===id);if(!c)return NO_COLOR;const l=groupLooks().find(x=>x.c.id===id);
  return {...c,name:l.name,c:l.color,emoji:l.emoji}};
/** Small group marker: emoji if the name has one, otherwise a coloured dot. */
const gBadge=(co,size)=>co.emoji?`<span class="gemo" style="font-size:${Math.round((size||12)*1.15)}px">${co.emoji}</span>`
  :`<span class="dot" style="${size?`width:${size}px;height:${size}px;`:""}background:${co.c}${co.id?"":";box-shadow:inset 0 0 0 1.5px var(--muted);background:transparent"}"></span>`;
const LEGACY_COLORS={blau:"dunkelblau",tuerkis:"hellblau"};
const STATUS={
  present:{label:"Anwesend",sym:"✔",icon:I.check,cls:"ok"},
  pickedup:{label:"Früher abgeholt",sym:"⌂",icon:I.home,cls:"pick"},
  sick:{label:"Krank",sym:"✚",icon:I.cross,cls:"sick"},
  none:{label:"Nicht da / offen",sym:"–",icon:I.open,cls:"open"}

/* ---------- Native bridge ---------- */
const N = window.Android || null;
function haptic(kind){
  try{ if(N&&N.haptic){N.haptic(kind);return;} }catch(e){}
  if(navigator.vibrate){const p={tick:12,light:18,medium:35,heavy:60,done:[30,70,30,70,90],undo:[15,60,15],success:[20,40,30],warn:[40,60,40]}[kind]||15;navigator.vibrate(p)}
}

/* ---------- Storage ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let DB={version:1,kids:[],records:{},settings:{}};
/* All profiles live in ROOT; DB is always the data of the active profile. */
let ROOT={format:2,active:null,profiles:[]};
const emptyDB=()=>({version:1,kids:[],records:{},settings:{}});
function normalizeDB(d){
  d=Object.assign(emptyDB(),d||{}); if(!d.settings) d.settings={};
  const mig=o=>{if(o&&LEGACY_COLORS[o.color]) o.color=LEGACY_COLORS[o.color]};
  d.kids.forEach(mig);
  for(const r of Object.values(d.records)) for(const e of Object.values(r.entries)) mig(e.snap);
  return d;
}
function load(){
  let raw=null, parsed=null;
  try{ raw = N&&N.loadData ? N.loadData() : localStorage.getItem("anw-db"); }catch(e){}
  if(raw){ try{ parsed=JSON.parse(raw); }catch(e){} }
  if(parsed&&Array.isArray(parsed.profiles)&&parsed.profiles.length) ROOT=parsed;
  else ROOT={format:2,active:null,profiles:[{id:uid(),name:"Profil 1",color:0,db:parsed&&parsed.kids?parsed:emptyDB()}]};
  if(!ROOT.profiles.some(p=>p.id===ROOT.active)) ROOT.active=ROOT.profiles[0].id;
  activateProfile(ROOT.active);
  if(dedupeKids()) saveNow();
  applyRetention();
}
const activeProfile=()=>ROOT.profiles.find(p=>p.id===ROOT.active);
function activateProfile(id){
  const p=ROOT.profiles.find(x=>x.id===id)||ROOT.profiles[0];
  ROOT.active=p.id; p.db=normalizeDB(p.db); DB=p.db;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,150);
}
function saveNow(){
  clearTimeout(saveTimer);
  const ap=activeProfile(); if(ap) ap.db=DB;
  const s=JSON.stringify(ROOT);
  try{ if(N&&N.saveData){N.saveData(s);} else localStorage.setItem("anw-db",s);}catch(e){}
}

/* ---------- Date helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtDate=d=>pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear();
const fmtTime=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function todayWork(){ // today, or last Friday on weekends
  const t=new Date(); t.setHours(0,0,0,0);
  const w=t.getDay();
  if(w===6) return {date:addDays(t,-1),weekend:true};
  if(w===0) return {date:addDays(t,-2),weekend:true};
  return {date:t,weekend:false};
}
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));

/* ---------- State ---------- */
const S={view:"today",date:todayWork().date,weekendHint:todayWork().weekend,filter:"all",calMonth:null,calSel:null,mWeekday:null};
S.mWeekday=Math.min(5,Math.max(1,S.date.getDay()));

/* ---------- Data logic ---------- */
/** Sort mode per tab: "first" (Vorname) or "last" (Nachname). Attendance defaults to Nachname, master data to Vorname. */
function sortMode(tab){const m=DB.settings&&DB.settings["sort_"+tab];return m||(tab==="master"?"first":"last")}
function cmpBy(mode){const c=(x,y)=>(x||"").localeCompare(y||"","de");
  return mode==="first"?(a,b)=>c(a.first,b.first)||c(a.last,b.last):(a,b)=>c(a.last,b.last)||c(a.first,b.first)}
const displayName=(k,mode)=>mode==="first"?`${k.first} ${k.last}`.trim():(k.last&&k.first?`${k.last}, ${k.first}`:(k.last||k.first||""));
function sortBtn(tab){const m=sortMode(tab);return `<button class="sortbtn" id="sortBtn" aria-label="Sortierung ändern">${I.sort}<span>${m==="first"?"Vorname":"Nachname"}</span></button>`}
function toggleSort(tab,rerender){DB.settings["sort_"+tab]=sortMode(tab)==="first"?"last":"first";save();haptic("light");rerender();
  showToast("Sortiert nach "+(sortMode(tab)==="first"?"Vorname":"Nachname"))}
function rosterFor(weekday,mode){return DB.kids.filter(k=>k.day===weekday).sort(cmpBy(mode||sortMode("master")))}
function getRecord(dateIso){return DB.records[dateIso]}
/** Children shown for a date: current roster for the weekday, plus any children
 *  recorded that day that no longer exist in the roster (history stays intact). */
function kidsForDate(d){
  const key=iso(d), rec=getRecord(key), list=rosterFor(d.getDay(),sortMode("today")).map(k=>({...k}));
  if(rec){
    const ids=new Set(list.map(k=>k.id));
    for(const [id,e] of Object.entries(rec.entries)){
      if(!ids.has(id)&&e.status!=="none"&&e.snap) list.push({id,...e.snap,removed:true});
    }
    // for past days use the snapshot's name/group as recorded
    for(const k of list){const e=rec.entries[k.id]; if(e&&e.snap&&k.removed!==true&&key<iso(new Date())){Object.assign(k,e.snap)}}
  }
  return list.sort(cmpBy(sortMode("today")));
}
function statusOf(dateIso,id){const r=getRecord(dateIso);return (r&&r.entries[id]&&r.entries[id].status)||"none"}
function entryOf(dateIso,id){const r=getRecord(dateIso);return r&&r.entries[id]}
function setStatus(d,kid,status){
  const key=iso(d);
  if(!DB.records[key]) DB.records[key]={weekday:d.getDay(),entries:{}};
  const rec=DB.records[key];
  const prev=rec.entries[kid.id];
  if(status==="none"){ delete rec.entries[kid.id]; if(!Object.keys(rec.entries).length) delete DB.records[key]; }
  else{
    const now=new Date();
    rec.entries[kid.id]={status,time:fmtTime(now),
      arrived:(prev&&prev.arrived)||(status==="present"||status==="pickedup"?fmtTime(now):undefined),
      snap:{first:kid.first,last:kid.last,color:kid.color,cls:kid.cls}};
    if(status==="pickedup"&&prev&&prev.status==="pickedup") rec.entries[kid.id].time=prev.time;
  }
  save();
  return prev?prev.status:"none";
}
function counts(d){
  const key=iso(d), kids=kidsForDate(d);
  const c={present:0,pickedup:0,sick:0,none:0,total:kids.length};
  for(const k of kids) c[statusOf(key,k.id)]++;
  return c;
}

const PCOLORS=["#3b5bfd","#0d9488","#c026d3","#ea580c","#16a34a","#dc2626","#7c3aed","#0284c7"];
function initials(name){

  if(!w.length) return "?";
  if(w.length===1) return [...w[0]][0].toUpperCase();

(function bindPill(){
  const el=$("#pPill"); let y0=null,x0=0,moved=false;
  el.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX;moved=false},{passive:true});
  el.addEventListener("touchmove",e=>{if(y0===null)return;e.preventDefault();
    const dy=e.touches[0].clientY-y0; if(Math.abs(dy)>6) moved=true;
    $("#pPillTxt").style.transform=`translateY(${Math.max(-10,Math.min(10,dy/3))}px)`},{passive:false});
  el.addEventListener("touchend",e=>{if(y0===null)return;
    const dy=e.changedTouches[0].clientY-y0, dx=e.changedTouches[0].clientX-x0; y0=null;
    $("#pPillTxt").style.transform="";

/* ---------- Attendance view ---------- */

  const mon=mondayOf(d);
  let tabs='<div class="days">';
  for(let i=0;i<5;i++){

    tabs+=`<button data-date="${iso(x)}" class="${iso(x)===key?"active":""} ${iso(x)===iso(new Date())?"today":""}"><b>${WD_SHORT[x.getDay()]}</b><small>${pad(x.getDate())}.${pad(x.getMonth()+1)}.</small></button>`;
  }

    h+=`<div class="empty">${I.users}<b>Keine Kinder für ${WD_LONG[d.getDay()]}</b>Lege die Kinder unter „Stammdaten“ an.<br><br><button class="btn" id="goMaster">${I.plus} Kinder anlegen</button></div>`;

  }

    <div class="stat ok"><div class="n">${I.check}${c.present}</div><div class="l">Anwesend</div></div>
    <div class="stat pick"><div class="n">${I.home}${c.pickedup}</div><div class="l">Abgeholt</div></div>

  // filters by colour group and class
  const groups=[...new Set(kids.map(k=>k.color))].filter(x=>x!==undefined);

    if(groups.length>1) for(const g of groups){const co=colorOf(g);h+=`<button class="chip ${S.filter==="g:"+g?"active":""}" data-f="g:${esc(g)}">${gBadge(co)}${esc(co.name)}</button>`}
    if(classes.length>1) for(const cl of classes){h+=`<button class="chip ${S.filter==="c:"+cl?"active":""}" data-f="c:${esc(cl)}">Klasse ${esc(cl)}</button>`}

function kidRow(k,key){
  const st=statusOf(key,k.id), e=entryOf(key,k.id), co=colorOf(k.color);

  if(st==="sick") tag=`<span class="tag sick">krank</span>`;
  const checkIcon=st==="sick"?I.cross.replace('stroke-width="2.6"','stroke-width="3"').replace('M12 5v14M5 12h14','M12 6v12M6 12h12'):st==="pickedup"?I.home:I.check;
  return `<div class="kid ${st}" data-id="${k.id}">
    <span class="bar" style="background:${co.c}"></span>
    <span class="check">${checkIcon}</span>
    <div class="info"><div class="nline"><span class="name"><span class="fn">${esc(k.first||k.last)}</span></span>${k.color?`<span class="cg">${gBadge(co,8)}${esc(co.name)}</span>`:""}</div>
      <div class="meta">${k.first&&k.last?`<span class="ln">${esc(k.last)}</span>`:""}${k.cls?`<span>Kl. ${esc(k.cls)}</span>`:""}${k.removed?"<span>(entfernt)</span>":""}${tag}</div></div>

}

  document.querySelectorAll(".filters .chip").forEach(b=>b.onclick=()=>{haptic("tick");S.filter=b.dataset.f;renderToday()});

      const id=row.dataset.id, kid=kidsForDate(S.date).find(k=>k.id===id); if(!kid) return;

      else if(next==="sick") showToast(`${kid.first} als krank markiert`);

  });

/** "All done" effect: ring + check pops out of the stats, then the tiles fill with their colours. */

  document.body.appendChild(b); setTimeout(()=>b.remove(),1300);

function updateRow(row,kid,key,pop){
  // Replace row content without re-rendering list (keeps scroll + animations smooth)
  const tmp=document.createElement("div"); tmp.innerHTML=kidRow(kid,key).trim();
  const fresh=tmp.firstChild;
  // animate: apply old class first then switch so CSS transitions run
  row.querySelector(".info").innerHTML=fresh.querySelector(".info").innerHTML;
  row.querySelector(".check").innerHTML=fresh.querySelector(".check").innerHTML;
  row.className=fresh.className+(pop?" pop":"");
  setTimeout(()=>row.classList.remove("pop"),400);
  // update counters
  const c=counts(S.date);
  const st=document.querySelectorAll(".stat .n");
  if(st.length===4){st[0].innerHTML=I.check+c.present;st[1].innerHTML=I.home+c.pickedup;st[2].innerHTML=I.sick+c.sick;st[3].parentNode.innerHTML=openTile(c)}

}

/* ---------- Master data ---------- */
/* A "person" is identified by first + last name; it has one entry per weekday in DB.kids. */
const pkey=k=>((k.first||"").trim()+"|"+(k.last||"").trim()).toLocaleLowerCase("de");
const entriesOf=key=>DB.kids.filter(k=>pkey(k)===key);
/** All distinct children, one object per person with the weekdays they attend. */
function persons(){
  const m=new Map();
  for(const k of DB.kids){const key=pkey(k);if(!m.has(key))m.set(key,{...k,key,days:[]});m.get(key).days.push(k.day)}
  for(const p of m.values()) p.days.sort();
  return [...m.values()].sort(cmpBy(sortMode("master")));
}
/** Removes accidental duplicates (same child twice on the same weekday). */
function dedupeKids(){
  const seen=new Set(), before=DB.kids.length;
  DB.kids=DB.kids.filter(k=>{const id=pkey(k)+"#"+k.day;if(seen.has(id))return false;seen.add(id);return true});
  return before-DB.kids.length;
}
const daysLabel=days=>days.length===5?"Mo–Fr":days.map(w=>WD_SHORT[w]).join(" ");

  }

  $("#hExtra").querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{haptic("tick");S.mWeekday=b.dataset.wd==="all"?"all":+b.dataset.wd;$("#main").scrollTop=0;renderMaster()});
  $("#fab").onclick=()=>{haptic("light");openKidForm(null)};

  $("#mList").innerHTML=h;

function bindSwipe(el){
  const row=el.querySelector(".mrow"), id=el.dataset.id, scope=el.dataset.scope;
  let x0=0,y0=0,dx=0,mode=null,armed=false,swiped=false;
  el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;mode=null;armed=false;row.style.transition="none"},{passive:true});
  el.addEventListener("touchmove",e=>{
    const t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!mode){ if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.3) mode="h"; else if(Math.abs(my)>10) mode="v"; }
    if(mode!=="h") return;
    e.preventDefault();
    dx=mx; row.style.transform=`translateX(${dx}px)`; el.classList.add("swiping");
    el.classList.toggle("left",dx<0);
    const over=Math.abs(dx)>el.offsetWidth*0.35;
    if(over!==armed){armed=over;el.classList.toggle("armed",armed);haptic(armed?"medium":"tick")}
  },{passive:false});
  const end=()=>{
    if(mode!=="h"){return}
    swiped=true; setTimeout(()=>swiped=false,50);
    row.style.transition="transform .22s ease";
    if(armed){ row.style.transform=`translateX(${dx<0?-110:110}%)`; setTimeout(()=>deleteKidAnimated(el,id,scope),200); }
    else { row.style.transform=""; el.classList.remove("armed"); setTimeout(()=>el.classList.remove("swiping"),230); }
  };
  el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
  row.addEventListener("click",()=>{if(swiped)return;haptic("light");openKidForm(DB.kids.find(k=>k.id===id))});
}
/** Removes entries (with undo). scope "day": only this weekday entry; "all": the child on every weekday. */
function removeEntries(kid,scope){
  const victims=scope==="all"?entriesOf(pkey(kid)):[kid];
  const backup=DB.kids.slice();
  DB.kids=DB.kids.filter(k=>!victims.includes(k)); save(); haptic("heavy");
  return ()=>{DB.kids=backup;save();haptic("success");renderMaster()};
}
function deleteKidAnimated(el,id,scope){
  const kid=DB.kids.find(k=>k.id===id); if(!kid) return;
  el.style.height=el.offsetHeight+"px"; el.offsetHeight;
  el.style.transition="height .22s ease, margin .22s ease, opacity .22s"; el.style.height="0px"; el.style.opacity="0"; el.style.marginBottom="-8px";
  const undo=removeEntries(kid,scope);
  setTimeout(()=>{renderMaster();showToast(scope==="all"?`${kid.first} ${kid.last} gelöscht`:`${kid.first} von ${WD_LONG[kid.day]} entfernt`,"Rückgängig",undo)},230);
}

  let daysHtml=[1,2,3,4,5].map(w=>`<button type="button" data-w="${w}" class="${f.days.has(w)?"active":""}">${WD_SHORT[w]}</button>`).join("");

    <div class="actions">${isNew?"":`<button class="btn danger" id="fDel" style="flex:0 0 auto" aria-label="Kind löschen">${I.trash}</button>`}<button class="btn ghost" id="fCancel">Abbrechen</button><button class="btn" id="fSave">Speichern</button></div>`);
  document.querySelectorAll("#fColors button").forEach(b=>b.onclick=()=>{haptic("tick");f.color=b.dataset.c;document.querySelectorAll("#fColors button").forEach(x=>x.classList.toggle("active",x===b))});
  document.querySelectorAll("#fDays button").forEach(b=>b.onclick=()=>{haptic("tick");const w=+b.dataset.w;
    f.days.has(w)?f.days.delete(w):f.days.add(w); b.classList.toggle("active",f.days.has(w))});
  $("#fCancel").onclick=()=>{haptic("tick");closeSheet()};
  if(!isNew) $("#fDel").onclick=()=>{haptic("warn");confirmSheet(`${kid.first} ${kid.last} löschen?`,"Das Kind wird an allen Wochentagen aus den Stammdaten entfernt. Bereits erfasste Anwesenheiten bleiben im Kalender erhalten.","Löschen",()=>{const undo=removeEntries(kid,"all");closeSheet();renderMaster();showToast(`${kid.first} ${kid.last} gelöscht`,"Rückgängig",undo)})};
  $("#fSave").onclick=()=>{
    const first=$("#fFirst").value.trim(), last=$("#fLast").value.trim(), cls=$("#fCls").value.trim();
    if(!first&&!last){haptic("warn");$("#fFirst").focus();showToast("Bitte einen Namen eingeben");return}
    if(!COLORS.some(c=>c.id===f.color)) f.color="";
    if(!f.days.size){haptic("warn");showToast("Bitte mindestens einen Wochentag wählen");return}
    const newKey=pkey({first,last});
    // another child with this name already exists → merge into it instead of creating duplicates
    const others=DB.kids.filter(k=>pkey(k)===newKey&&!group.includes(k));
    if(isNew&&others.length){
      const have=new Set(others.map(k=>k.day)), add=[...f.days].filter(w=>!have.has(w));
      if(!add.length){haptic("warn");showToast(`${others[0].first} ${others[0].last} ist an diesen Tagen schon eingetragen`);return}

      save();haptic("success");closeSheet();renderMaster();showToast(`${first} zusätzlich an ${add.map(w=>WD_SHORT[w]).join(", ")} eingetragen`);return;
    }
    if(!isNew){
      DB.kids=DB.kids.filter(k=>!(group.includes(k)&&!f.days.has(k.day)));   // days switched off
      for(const k of group) Object.assign(k,{first,last,color:f.color,cls});
    }
    const pool=DB.kids.filter(k=>pkey(k)===newKey);
    for(const k of pool) Object.assign(k,{first,last,color:f.color,cls});
    const have=new Set(pool.map(k=>k.day));
    for(const w of f.days) if(!have.has(w)) DB.kids.push({id:uid(),first,last,color:f.color,cls,day:w});
    dedupeKids();
    save();haptic("success");closeSheet();renderMaster();
    showToast(isNew?(f.days.size>1?`${first} an ${f.days.size} Tagen angelegt`:`${first} angelegt`):"Gespeichert");
  };
  if(isNew) setTimeout(()=>$("#fFirst")&&$("#fFirst").focus(),320);
}

/* ---------- Retention (automatic deletion of old attendance entries) ---------- */
const RET_OPTIONS=[0,1,3,6,12,24];
const retLabel=m=>m===1?"1 Monat":m+" Monate";
function retCutoff(m){const t=new Date();t.setHours(0,0,0,0);return iso(new Date(t.getFullYear(),t.getMonth()-m,t.getDate()))}
const oldRecordKeys=m=>{const c=retCutoff(m);return Object.keys(DB.records).filter(k=>k<c)};
/** Deletes attendance entries older than the configured period; master data is never touched. */
function applyRetention(){
  const m=DB.settings&&DB.settings.retentionMonths; if(!m) return 0;
  const old=oldRecordKeys(m); old.forEach(k=>delete DB.records[k]); if(old.length) saveNow(); return old.length;
}
function openRetention(){
  const cur=DB.settings.retentionMonths||0;
  openSheet(`<h2>Alte Einträge automatisch löschen</h2>
    <p class="hint" style="margin:-6px 0 12px">Erfasste Anwesenheiten, die älter sind als der gewählte Zeitraum, werden automatisch gelöscht. Stammdaten (Kinder, Gruppen) bleiben erhalten. Gilt für das Profil „${esc(activeProfile().name)}“.</p>
    <div class="optlist radio">${RET_OPTIONS.map(m=>`<button data-m="${m}" class="${m===cur?"sel":""}"><span>${m?"Älter als "+retLabel(m):"Aus – nichts automatisch löschen"}${m?`<small>${(n=>n?n+(n===1?" erfasster Tag wäre":" erfasste Tage wären")+" jetzt betroffen":"Derzeit nichts betroffen")(oldRecordKeys(m).length)}</small>`:""}</span><i class="radio-dot"></i></button>`).join("")}</div>`);
  document.querySelectorAll(".optlist.radio button").forEach(b=>b.onclick=()=>{
    const m=+b.dataset.m, n=m?oldRecordKeys(m).length:0;
    const apply=()=>{DB.settings.retentionMonths=m;const del=applyRetention();save();haptic("success");closeSheet();
      showToast(m?`Automatisches Löschen aktiv (älter als ${retLabel(m)})${del?` – ${del} ${del===1?"Tag":"Tage"} gelöscht`:""}`:"Automatisches Löschen ausgeschaltet");render()};
    if(n){haptic("warn");confirmSheet(`${n} ${n===1?"erfassten Tag":"erfasste Tage"} löschen?`,`Mit dieser Einstellung werden alle Anwesenheiten vor dem ${fmtDate(fromIso(retCutoff(m)))} jetzt und künftig automatisch gelöscht. Das lässt sich nicht rückgängig machen.`,"Aktivieren & löschen",apply)}
    else{haptic("tick");apply()}
  });
}

/* ---------- Backup (optionally password-encrypted with AES-GCM, key from PBKDF2-SHA256) ---------- */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const PBKDF2_ITER=310000;
async function pwKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptBackup(json,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pwKey(pw,salt,PBKDF2_ITER),new TextEncoder().encode(json));
  return JSON.stringify({app:"grupp-checkan",type:"backup-encrypted",v:1,kdf:{name:"PBKDF2",hash:"SHA-256",iter:PBKDF2_ITER,salt:b64(salt)},cipher:"AES-GCM",iv:b64(iv),data:b64(ct)});
}
async function decryptBackup(o,pw){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},await pwKey(pw,unb64(o.kdf.salt),o.kdf.iter),unb64(o.data));
  return new TextDecoder().decode(pt);
}
const cryptoOk=()=>!!(window.crypto&&crypto.subtle);
function openBackup(){
  saveNow();
  openSheet(`<h2>Datensicherung erstellen</h2>
    <p class="hint" style="margin:-6px 0 14px">Sichert Stammdaten, Gruppen und Anwesenheiten des Profils „${esc(activeProfile().name)}“ in eine Datei.</p>
    <label class="switchrow"><span>Mit Passwort verschlüsseln<small>Die Datei ist ohne Passwort nicht lesbar</small></span><input type="checkbox" id="bEnc"><i class="switch"></i></label>
    <div id="bPw" style="display:none">
      <div class="field"><label>Passwort</label><input type="password" id="bPw1" autocomplete="new-password" placeholder="mindestens 6 Zeichen"></div>
      <div class="field"><label>Passwort wiederholen</label><input type="password" id="bPw2" autocomplete="new-password"></div>
      <div class="hint" style="margin:-6px 0 14px">Wichtig: Ohne dieses Passwort lässt sich die Sicherung nicht wiederherstellen – es kann nicht zurückgesetzt werden.</div>
    </div>
    <div class="actions"><button class="btn ghost" id="bCancel">Abbrechen</button><button class="btn" id="bSave">${I.save} Speichern</button></div>`);
  $("#bEnc").onchange=()=>{haptic("tick");$("#bPw").style.display=$("#bEnc").checked?"":"none";if($("#bEnc").checked)setTimeout(()=>$("#bPw1").focus(),50)};
  $("#bCancel").onclick=()=>{haptic("tick");closeSheet()};
  $("#bSave").onclick=async()=>{
    const enc=$("#bEnc").checked, base="Anwesenheit_Sicherung_"+iso(new Date())+"_"+activeProfile().name.replace(/[^\wäöüÄÖÜß-]+/g,"_");
    let text=JSON.stringify(DB,null,1), name=base+".json";
    if(enc){
      const p1=$("#bPw1").value, p2=$("#bPw2").value;
      if(p1.length<6){haptic("warn");showToast("Passwort: mindestens 6 Zeichen");$("#bPw1").focus();return}
      if(p1!==p2){haptic("warn");showToast("Die Passwörter stimmen nicht überein");$("#bPw2").focus();return}
      if(!cryptoOk()){haptic("warn");showToast("Verschlüsselung wird auf diesem Gerät nicht unterstützt");return}
      $("#bSave").disabled=true; $("#bSave").textContent="Verschlüssele …";
      text=await encryptBackup(JSON.stringify(DB),p1); name=base+"_verschluesselt.json";
    }
    closeSheet();
    if(N&&N.saveFile) N.saveFile(name,text,"application/json"); else downloadFallback(name,text);
  };
}
function askBackupPassword(o){
  openSheet(`<h2>Sicherung entschlüsseln</h2>
    <p class="hint" style="margin:-6px 0 14px">Diese Sicherung ist mit einem Passwort geschützt.</p>
    <div class="field"><label>Passwort</label><input type="password" id="rPw" autocomplete="current-password" enterkeyhint="done"></div>
    <div class="actions"><button class="btn ghost" id="rCancel">Abbrechen</button><button class="btn" id="rOk">Entschlüsseln</button></div>`);
  setTimeout(()=>$("#rPw").focus(),320);
  $("#rCancel").onclick=()=>{haptic("tick");closeSheet()};
  const go=async()=>{
    if(!cryptoOk()){haptic("warn");showToast("Verschlüsselung wird auf diesem Gerät nicht unterstützt");return}
    $("#rOk").disabled=true; $("#rOk").textContent="Prüfe …";
    try{ const txt=await decryptBackup(o,$("#rPw").value); restoreFromText(txt); }
    catch(e){ haptic("warn"); showToast("Falsches Passwort"); $("#rOk").disabled=false; $("#rOk").textContent="Entschlüsseln"; $("#rPw").select(); }
  };
  $("#rOk").onclick=go; $("#rPw").onkeydown=e=>{if(e.key==="Enter")go()};
}
window.onFileOpened=function(text){
  try{ const o=JSON.parse(text); if(o&&o.type==="backup-encrypted"&&o.data){askBackupPassword(o);return} }catch(e){}
  restoreFromText(text);
};
function restoreFromText(text){
  try{
    const d=JSON.parse(text); if(!d||!Array.isArray(d.kids)||typeof d.records!=="object") throw 0;
    confirmSheet("Sicherung wiederherstellen?",`Die aktuellen Daten werden durch die Sicherung ersetzt (${d.kids.length} Einträge in den Stammdaten, ${Object.keys(d.records).length} erfasste Tage).`,"Wiederherstellen",()=>{
      DB=Object.assign({version:1,kids:[],records:{},settings:{}},d);if(!DB.settings)DB.settings={};dedupeKids();saveNow();haptic("success");closeSheet();render();showToast("Sicherung wiederhergestellt")});
  }catch(e){haptic("warn");showToast("Datei ist keine gültige Sicherung")}
}

/* ---------- Export ---------- */
function padR(s,n){s=String(s);const len=[...s].length;return len>=n?[...s].slice(0,n).join(""):s+" ".repeat(n-len)}
function textTable(head,rows){
  const w=head.map((h,i)=>Math.max([...h].length,...rows.map(r=>[...r[i]].length)));
  const line="+"+w.map(n=>"-".repeat(n+2)).join("+")+"+";
  const fmt=r=>"| "+r.map((x,i)=>padR(x,w[i])).join(" | ")+" |";
  return [line,fmt(head),line.replace(/-/g,"="),...rows.map(fmt),line];
}
/** Master-data export: one table per weekday, sorted like the master-data tab. */
function buildRosterText(days){
  const mode=sortMode("master"), all=days.length>1, out=[];
  const title=all?"KINDERLISTEN – GESAMTÜBERSICHT":"KINDERLISTE "+WD_LONG[days[0]].toUpperCase();
  out.push(title,"=".repeat([...title].length));
  out.push("Sortiert:  nach "+(mode==="first"?"Vorname":"Nachname"));
  for(const wd of days){
    const kids=rosterFor(wd,mode);
    out.push("");
    if(all){const h=WD_LONG[wd].toUpperCase()+"  ("+kids.length+" "+(kids.length===1?"Kind":"Kinder")+")";out.push(h,"-".repeat([...h].length))}
    if(!kids.length){out.push("  (keine Kinder eingetragen)");continue}
    const head=mode==="first"?["Nr","Vorname","Nachname","Gruppe","Klasse"]:["Nr","Nachname","Vorname","Gruppe","Klasse"];
    const rows=kids.map((k,i)=>{const n=mode==="first"?[k.first||"",k.last||""]:[k.last||"",k.first||""];
      return [String(i+1),...n,colorOf(k.color).id?colorOf(k.color).name:"-",k.cls||"-"]});
    out.push(...textTable(head,rows));
    if(!all) out.push("","Kinder gesamt: "+kids.length);
  }
  if(all){
    out.push("","ZUSAMMENFASSUNG");
    for(const wd of days){const n=rosterFor(wd).length;out.push("  "+padR(WD_LONG[wd]+":",12)+n+" "+(n===1?"Kind":"Kinder"))}
    out.push("  "+padR("Gesamt:",12)+days.reduce((a,wd)=>a+rosterFor(wd).length,0)+" Einträge");
  }
  return out.join("\n")+"\n";
}
/** Month overview: matrix child × school day, plus totals per child and per day.
 *  Only days up to today are included; days without any entry count as "nicht erfasst". */
function buildMonthText(m){
  const todayKey=iso(new Date()), y=m.getFullYear(), mo=m.getMonth(), mode=sortMode("today");
  const days=[];
  for(let d=new Date(y,mo,1);d.getMonth()===mo;d=addDays(d,1)){
    if(d.getDay()===0||d.getDay()===6||iso(d)>todayKey) continue;
    const key=iso(d), rec=getRecord(key);
    days.push({d,key,recorded:!!(rec&&Object.keys(rec.entries).length),kids:kidsForDate(d)});
  }
  const title="MONATSÜBERSICHT "+MONTHS[mo].toUpperCase()+" "+y, out=[title,"=".repeat([...title].length)];
  out.push("Zeitraum:  "+(days.length?fmtDate(days[0].d)+" – "+fmtDate(days[days.length-1].d):"–"));
  out.push("","Legende:   ✔ = anwesend   ⌂ = früher abgeholt   ✚ = krank   – = nicht erfasst/fehlt","           · = an diesem Tag nicht auf der Liste   (leere Spalte = Tag ohne Erfassung)");
  if(!days.length){out.push("","Für diesen Monat liegen noch keine Schultage vor.");return out.join("\n")+"\n"}
  // collect children (same name on several weekdays = one row)
  const people=new Map();
  for(const day of days) for(const k of day.kids){
    const id=(k.first||"")+"|"+(k.last||"");
    if(!people.has(id)) people.set(id,{k,cells:{},n:{present:0,pickedup:0,sick:0,none:0}});
    const p=people.get(id);
    if(!day.recorded) continue;
    const st=statusOf(day.key,k.id); p.cells[day.key]=STATUS[st].sym; p.n[st]++;
  }
  const rows=[...people.values()].sort((a,b)=>cmpBy(mode)(a.k,b.k));
  const nameW=Math.max(4,...rows.map(r=>[...displayName(r.k,mode)].length));
  const dayCols=days.map(x=>x.key);
  const sep="+"+"-".repeat(nameW+2)+"+"+dayCols.map(()=>"---").join("")+"-+"+"-----".repeat(4)+"-+";
  const h1="| "+padR("",nameW)+" |"+days.map(x=>" "+WD_SHORT[x.d.getDay()]).join("")+" | "+["✔","⌂","✚","–"].map(x=>padR(x,4)).join(" ")+" |";
  const h2="| "+padR("Name",nameW)+" |"+days.map(x=>" "+pad(x.d.getDate())).join("")+" | "+["anw","abg","kra","feh"].map(x=>padR(x,4)).join(" ")+" |";
  out.push("",sep,h1,h2,sep.replace(/-/g,"="));
  for(const r of rows){
    const cells=days.map(x=>"  "+(!x.recorded?" ":(r.cells[x.key]||"·"))).join("");
    out.push("| "+padR(displayName(r.k,mode),nameW)+" |"+cells+" | "+[r.n.present,r.n.pickedup,r.n.sick,r.n.none].map(x=>padR(String(x),4)).join(" ")+" |");
  }
  out.push(sep);
  return out.join("\n")+"\n";
}
function buildPersonsText(){
  const mode=sortMode("master"), ps=persons(), out=["KINDER – GESAMTLISTE","===================="];
  out.push("Sortiert:  nach "+(mode==="first"?"Vorname":"Nachname"),"");
  if(!ps.length){out.push("(keine Kinder eingetragen)");return out.join("\n")+"\n"}
  const head=mode==="first"?["Nr","Vorname","Nachname","Gruppe","Klasse","Tage"]:["Nr","Nachname","Vorname","Gruppe","Klasse","Tage"];
  const rows=ps.map((p,i)=>{const n=mode==="first"?[p.first||"",p.last||""]:[p.last||"",p.first||""];
    return [String(i+1),...n,colorOf(p.color).id?colorOf(p.color).name:"-",p.cls||"-",daysLabel(p.days)]});
  out.push(...textTable(head,rows),"","Kinder gesamt: "+ps.length);
  return out.join("\n")+"\n";
}
function buildTable(d){
  const key=iso(d), kids=kidsForDate(d), c=counts(d);
  const rows=kids.map((k,i)=>{const e=entryOf(key,k.id), st=statusOf(key,k.id);
    let s=STATUS[st].sym+" "+STATUS[st].label;
    if(st==="present"&&e&&e.arrived) s=STATUS.present.sym+" Anwesend ("+e.arrived+")";
    if(st==="pickedup") s=STATUS.pickedup.sym+" Früher abgeholt "+(e?e.time:"");
    if(st==="none") s=STATUS.none.sym+" Nicht erfasst";
    return [String(i+1),k.last||"",k.first||"",colorOf(k.color).id?colorOf(k.color).name:"-",k.cls||"-",s]});
  const head=["Nr","Nachname","Vorname","Gruppe","Klasse","Status"];
  if(sortMode("today")==="first"){head.splice(1,2,"Vorname","Nachname");rows.forEach(r=>r.splice(1,2,r[2],r[1]))}
  const out=[];
  out.push("ANWESENHEITSLISTE");
  out.push("=================");
  out.push("Tag:       "+WD_LONG[d.getDay()]+", "+fmtDate(d));
  out.push("");
  out.push("Legende:   ✔ = anwesend   ⌂ = früher abgeholt   ✚ = krank   – = nicht erfasst");
  out.push("");
  out.push(...textTable(head,rows));
  out.push("");
  out.push("ZUSAMMENFASSUNG");
  out.push("  Kinder gesamt:     "+c.total);
  out.push("  ✔ Anwesend:        "+c.present);
  out.push("  ⌂ Früher abgeholt: "+c.pickedup);
  out.push("  ✚ Krank:           "+c.sick);
  out.push("  – Nicht erfasst:   "+c.none);
  return out.join("\n")+"\n";
}
function openExport(d){
  openTextSheet(`Export · ${WD_SHORT[d.getDay()]}, ${fmtDate(d)}`,buildTable(d),"Anwesenheit_"+iso(d)+"_"+WD_LONG[d.getDay()]+".txt");
}
function openTextSheet(title,txt,name){
  openSheet(`<h2>${esc(title)}</h2><pre class="preview">${esc(txt)}</pre>
    <div class="actions"><button class="btn ghost" id="eSave">${I.save} Speichern</button><button class="btn" id="eShare">${I.share} Teilen</button></div>`);
  $("#eSave").onclick=()=>{haptic("light");if(N&&N.saveFile)N.saveFile(name,txt,"text/plain");else downloadFallback(name,txt)};
  $("#eShare").onclick=()=>{haptic("light");if(N&&N.shareFile)N.shareFile(name,txt);else if(navigator.share)navigator.share({title:name,text:txt});else downloadFallback(name,txt)};
}
function downloadFallback(name,txt){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download=name;a.click()}
window.onNativeResult=function(msg,ok){haptic(ok?"success":"warn");showToast(msg)};

/* ---------- Sheet, toast, confirm ---------- */
let sheetOpen=false;
function openSheet(html){$("#sheet").innerHTML='<div class="grab"></div>'+html;$("#scrim").classList.add("show");$("#sheet").classList.add("show");sheetOpen=true}
function closeSheet(){const sh=$("#sheet");sh.style.transition="";sh.style.transform="";$("#scrim").style.opacity="";$("#scrim").classList.remove("show");sh.classList.remove("show");sheetOpen=false;if(document.activeElement)document.activeElement.blur()}
$("#scrim").onclick=()=>{haptic("tick");closeSheet()};
/* Swipe the bottom sheet down to close it (only when its content is scrolled to the top). */
(function(){
  const sh=$("#sheet"), sc=$("#scrim");
  let y0=0,x0=0,t0=0,dy=0,state=null; // state: null | "drag" | "ignore"
  sh.addEventListener("touchstart",e=>{
    if(!sheetOpen){state="ignore";return}
    const inner=e.target.closest(".preview");
    state=(sh.scrollTop>0||(inner&&inner.scrollTop>0)||e.target.closest("input,textarea"))?"ignore":null;
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;t0=Date.now();dy=0;
  },{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(state==="ignore") return;
    const my=e.touches[0].clientY-y0, mx=e.touches[0].clientX-x0;
    if(state===null){ if(Math.abs(my)<8&&Math.abs(mx)<8) return;
      state=(my>0&&Math.abs(my)>Math.abs(mx))?"drag":"ignore";
      if(state==="drag"){sh.style.transition="none";sc.style.transition="none";if(document.activeElement)document.activeElement.blur()} else return; }
    e.preventDefault();
    dy=Math.max(0,my); sh.style.transform=`translateY(${dy}px)`;
    sc.style.opacity=String(Math.max(0,1-dy/(sh.offsetHeight||400)));
  },{passive:false});
  const end=()=>{
    if(state!=="drag"){state=null;return}
    state=null; sh.style.transition=""; sc.style.transition="";
    const fast=dy>40&&dy/(Date.now()-t0)>0.5;
    if(dy>Math.min(140,sh.offsetHeight*0.3)||fast){haptic("tick");closeSheet()}
    else {sh.style.transform="";sc.style.opacity=""}
  };
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
})();
function confirmSheet(title,text,okLabel,onOk){
  openSheet(`<h2>${esc(title)}</h2><p style="color:var(--muted);margin:-6px 0 18px">${esc(text)}</p><div class="actions"><button class="btn ghost" id="qC">Abbrechen</button><button class="btn danger" id="qOk">${esc(okLabel)}</button></div>`);
  $("#qC").onclick=()=>{haptic("tick");closeSheet()}; $("#qOk").onclick=onOk;
}
let toastTimer=null;
function showToast(msg,actionLabel,action){
  const t=$("#toast"); t.innerHTML=`<span>${esc(msg)}</span>`+(actionLabel?`<button>${esc(actionLabel)}</button>`:"");
  if(actionLabel) t.querySelector("button").onclick=()=>{t.classList.remove("show");action()};
  t.classList.toggle("top",sheetOpen); t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),actionLabel?4000:2200);
}

/* ---------- Navigation ---------- */
function go(view){S.view=view;closeSheet();$("#main").scrollTop=0;render()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{haptic("tick");
  if(b.dataset.view==="today"&&S.view==="today"){S.date=todayWork().date;}
  else if(b.dataset.view==="today"&&S.view!=="today"&&!S.keepDate){S.date=todayWork().date}
  go(b.dataset.view)});
// Android back button → returns true if handled
window.onBackPressed=function(){
  if(sheetOpen){closeSheet();return true}
  if(S.view!=="today"){go("today");return true}
  if(iso(S.date)!==iso(todayWork().date)){S.date=todayWork().date;renderToday();return true}
  return false;
};
window.setTheme=function(dark){document.documentElement.dataset.theme=dark?"dark":"light"};
// Auto-refresh when app is resumed on a new day
window.onAppResume=function(){applyRetention();const tw=todayWork();if(S.view==="today"&&iso(S.date)!==iso(tw.date)&&S.lastAutoDate!==iso(tw.date)){S.date=tw.date;S.weekendHint=tw.weekend;S.lastAutoDate=iso(tw.date);render()}};
S.lastAutoDate=iso(todayWork().date);

if(!N&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) setTheme(true);
load();
updatePill(0);
render();
</script>
